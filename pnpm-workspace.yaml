packages:
  - "apps/*"
  - "packages/*"

# Build scripts allowed to run during install (union of both source repos).
allowBuilds:
  core-js: true
  esbuild: true
  "@google/genai": true
  protobufjs: true
  sharp: true
  workerd: true
  "@swc/core": true
  # tsParticles' install script only warns about conflicting legacy particle
  # packages (we have none), so there's nothing for it to do here.
  "@tsparticles/engine": false
  core-js-pure: true

# Transitive dependencies held back on vulnerable versions by their parents.
# Each override stays inside the parent's major, so it is a drop-in bump.
# Drop an entry once every dependent resolves to a fixed version on its own.
#
# These are deliberately floors, not pins — an override says "no older than the
# fixed version", and pnpm-lock.yaml is what pins the exact one. Pinning here
# instead would freeze each package on a version that can itself pick up an
# advisory later, and would override direct dependants downwards: apps/mcp asks
# for esbuild ^0.28.2, so an exact 0.28.1 would drag it below its own range.
overrides:
  # GHSA advisories on undici < 7.29.0, reached through miniflare/wrangler.
  undici: "^7.29.0"
  # ws < 8.21.0 DoS, reached through miniflare/wrangler.
  ws: "^8.21.3"
  # qs < 6.16.0 prototype pollution, reached through express via the MCP SDK.
  qs: "^6.16.0"
  # fast-uri < 3.1.6 ReDoS, reached through ajv.
  fast-uri: "^3.1.6"
  # sharp < 0.35.0 and esbuild < 0.28.1, reached through the wrangler 4.72
  # that @cloudflare/vitest-pool-workers 0.12 pins. Current Cloudflare tooling
  # ships exactly these versions, so the bump matches what it expects.
  sharp: "^0.35.4"
  esbuild: "^0.28.1"
  # tmp < 0.2.6 symlink escape, reached through external-editor's "^0.0.33".
  # 0.2 keeps the fileSync/removeCallback API external-editor uses.
  tmp: "^0.2.7"

patchedDependencies:
  "@cfworker/json-schema@4.1.1": patches/@cfworker__json-schema@4.1.1.patch
  "@modelcontextprotocol/client@2.0.0": patches/@modelcontextprotocol__client@2.0.0.patch
  "@modelcontextprotocol/server@2.0.0": patches/@modelcontextprotocol__server@2.0.0.patch
