<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page reach under the status bar, notch
         and home indicator, which is what makes the env(safe-area-inset-*)
         values non-zero. Everything pinned to a screen edge (the header,
         sheets, the full-screen practice view, toasts and the floating
         buttons) steps back by them through the --safe-* tokens and *-safe
         utilities in src/styles/globals.css. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Create and print Spelling lessons with sections, text, and images."
    />
    <!-- Site-wide social defaults. The SPA overrides these per page (see
         src/lib/seo.js); the Worker prerenders pages for crawlers so the
         per-page values end up in the snapshot scrapers receive. -->
    <meta property="og:site_name" content="Spelling Lesson Maker" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Spelling Lesson Maker" />
    <meta
      property="og:description"
      content="Create and print Spelling lessons with sections, text, and images."
    />
    <!-- Homepage screenshot rendered by the Worker (/og-image). The SPA swaps in
         a per-page screenshot via src/lib/seo.js; this is the default a scraper
         sees if the page isn't prerendered. -->
    <meta
      property="og:image"
      content="https://spellingcreator.org/og-image?path=/"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Spelling Lesson Maker</title>
    <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
    <!-- PWA. The <link rel="manifest"> is injected at build time by
         vite-plugin-pwa from the `manifest` block in vite.config.js; what it
         doesn't own is written here.

         theme-color tints the OS/browser chrome around an installed window, so
         it has to match whatever is actually at the top of the screen. That
         used to be AppHeader's block of --primary indigo; the top of the screen
         is now the page itself (PageBar draws on the background), so these
         track --background instead — see src/styles/globals.css. Safari picks
         the first matching tag, so the dark one must come first. iOS ignores
         the manifest's icons and uses apple-touch-icon; it also ignores
         `display: standalone` unless mobile-web-app-capable is present. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#12131f"
    />
    <meta name="theme-color" content="#dee3f3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spelling" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Autodiscovery for the hub's "latest lessons" Atom feed, served same-origin
         by the Worker at /feed.xml (surfaced as "RSS" in the UI). -->
    <link
      rel="alternate"
      type="application/atom+xml"
      title="Spelling Creator: latest lessons"
      href="/feed.xml"
    />
    <!-- Cloudflare Turnstile. Explicit render so we can mount the widget
         inside the AI dialog on demand and read its verified token. -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <!-- Google Identity Services. Provides the OAuth2 token client used to
         save lessons to the signed-in user's Google Drive as Google Docs. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Apply the stored/OS color scheme before first paint so there's no
         flash of the wrong theme. Mirrors src/lib/colorScheme.jsx, which
         takes over once React mounts. Keep the storage key in sync with the
         STORAGE_KEY constant there. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("spelling-creator:color-scheme");
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          // localStorage/matchMedia unavailable — leave unset, defaults to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
