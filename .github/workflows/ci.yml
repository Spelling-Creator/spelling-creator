name: CI

# Runs the checks on every pull request, and on main after a merge.
#
# Until this existed, deploy.yml was the only workflow, and it only triggers on a
# push to main — so nothing lint-checked or tested a pull request, and the test
# suites across core/api/mcp only ever ran on someone's laptop. A deploy that
# fails its lint step has already been merged by the time it fails.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # Images and videos stay as Git LFS pointers here (no `lfs: true`): no
      # test reads them, and the builds below only copy them, so pulling them
      # would spend LFS bandwidth on every push for nothing. deploy.yml pulls them.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # --frozen-lockfile fails rather than resolving a lockfile that doesn't
      # match the manifests, which is exactly the drift a PR should be caught on.
      # deploy.yml passes it too; both state it explicitly instead of leaning on
      # pnpm's CI default.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      # Turborepo's cache, carried from earlier runs, so a task whose inputs have
      # not changed is replayed instead of run. Each run saves under its own
      # commit and restores the newest earlier one; pull requests can read the
      # caches main saved. deploy.yml deliberately has no cache: this job checks
      # out Git LFS files as pointers, and turbo hashes a pointer and its real
      # file the same, so a build cached here must never be what ships.
      #
      # Turborepo's hashes leave out the Node version and this workflow (which
      # also pins pnpm), so both go into the key instead. Bumping either starts
      # from an empty cache, rather than replaying test passes from the old one.
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-node${{ steps.node.outputs.node-version }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.sha }}
          restore-keys: turbo-node${{ steps.node.outputs.node-version }}-${{ hashFiles('.github/workflows/ci.yml') }}-

      # One turbo run, which orders the tasks itself (turbo.json):
      #
      # - every workspace's `test`: core, web and stub-api (vitest), api (vitest
      #   under @cloudflare/vitest-pool-workers), mcp and cli (node --test).
      #   apps/docs has no test script and is skipped.
      # - `typecheck` for the TypeScript workspaces, core and the CLI. Nothing
      #   else checks their types: every runner that loads them strips the
      #   types without reading them.
      # - the web app (client and SSR halves), the docs and the CLI `build`. No
      #   VITE_* secrets here: they are injected only for the real deploy, and a
      #   pull request from a fork could not read them anyway. The build still
      #   resolves every import and runs the full bundler, which is what catches
      #   a bad module path or a broken chunk boundary.
      # - the Worker `bundle`, without deploying (no credentials needed). This is
      #   the only step that runs wrangler's own module resolution, so it is what
      #   catches a `.wasm` or Text import that the test runner cannot resolve for
      #   itself (see apps/api/vitest.workers.config.js), and more generally a
      #   dependency that bundles fine under Vite but not for workerd.
      #
      # --summarize records the run's task hashes for the prune step below.
      - name: Test and build
        run: pnpm exec turbo run typecheck test build build:ssr bundle --summarize

      # Turborepo never evicts from its cache, so this drops every entry the run
      # above did not use before the cache is saved. Without it each commit's
      # saved cache would be bigger than the last.
      - name: Prune Turborepo cache
        run: node scripts/prune-turbo-cache.mjs
