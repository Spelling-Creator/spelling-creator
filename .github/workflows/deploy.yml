name: Deploy to Cloudflare

# The Worker hosts the web apps: it serves the built files as static assets,
# renders the new app's pages through its server build, and prerenders the old
# app's pages for crawlers with Browser Rendering. So a deploy builds both web
# apps and the VitePress docs (into apps/web/dist/docs), then `wrangler deploy`
# uploads the Worker together with apps/web/dist.
#
# That happens in two jobs. `build` lints and builds, and hands apps/web/dist,
# apps/web/dist-ssr and apps/web-next/build to `deploy` as an artifact.
# `deploy` is the only job that reads the Cloudflare token, so none of the
# build tooling runs with it in reach, and a failed deploy can be re-run on its
# own without rebuilding.
on:
  push:
    paths:
      - "apps/web/**"
      - "apps/web-next/**"
      - "apps/api/**"
      - "apps/mcp/**"
      - "apps/docs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".gitattributes"
      - ".github/workflows/deploy.yml"
    branches:
      - main
  workflow_dispatch:

# Don't run two deploys against the Worker at once.
concurrency:
  group: "deploy-cloudflare"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Images and videos live in Git LFS (see .gitattributes), and this is the
      # one job that ships them: the web app's public/ files and the docs videos
      # end up in apps/web/dist. Checking out leaves them as pointers, so they are
      # pulled here, through a cache keyed on the exact set of LFS files, so a
      # deploy that changes none of them downloads nothing from LFS.
      - name: List LFS files
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-

      - name: Pull LFS files
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # --frozen-lockfile is what pnpm already does under CI, but spelling it out
      # keeps the guarantee in this file rather than in an environment default: a
      # deploy must never resolve a lockfile that disagrees with the manifests.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug env
        run: |
          test -n "${{ secrets.VITE_API_URL }}" && echo "api ok"
          test -n "${{ secrets.VITE_TURNSTILE_SITE_KEY }}" && echo "turnstile ok"
          test -n "${{ secrets.VITE_GOOGLE_CLIENT_ID }}" && echo "google cloud ok"
          test -n "${{ secrets.VITE_SUPABASE_URL }}" && echo "supabase url ok"
          test -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" && echo "supabase anon key ok"

      # Both apps read the same values; each from its own .env, since Vite reads
      # env files from the package holding its config.
      - name: Inject env vars
        run: |
          for app in apps/web apps/web-next; do
            echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> "$app/.env"
            echo "VITE_TURNSTILE_SITE_KEY=${{ secrets.VITE_TURNSTILE_SITE_KEY }}" >> "$app/.env"
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> "$app/.env"
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> "$app/.env"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> "$app/.env"
          done

      - name: Lint
        run: pnpm lint

      # Builds both halves of the old web app, the new app, and the VitePress
      # docs, then copies the new app's client files and the docs into
      # apps/web/dist so they ship in the same assets bundle. Turborepo runs
      # the copies after the old app's build, which matters because Vite
      # empties apps/web/dist each time. There is no cache to restore here (see
      # the note in ci.yml), so everything really builds.
      - name: Build web apps and docs
        run: pnpm build:docs

      # dist is the static assets bundle (the new app's files and the docs
      # included); dist-ssr is the old app's server renderer that
      # apps/api/src/routes/ssr.js imports, and apps/web-next/build/server the
      # new app's that routes/next.js imports, so the Worker can't be bundled
      # without them. Hidden files are included so the artifact is an exact
      # copy of the build even if something like a .well-known/ file lands in
      # it.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            apps/web/dist
            apps/web/dist-ssr
            apps/web-next/build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Wrangler bundles apps/api from source at deploy time, so the Worker's
      # dependencies (and wrangler itself) are still needed here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Debug env
        run: test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" && echo "cloudflare token ok"

      # The artifact's root is apps (the common parent of the three paths), so
      # this restores apps/web/dist, apps/web/dist-ssr and apps/web-next/build.
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: apps

      # Deploys the Worker (apps/api) which bundles apps/web/dist as static
      # assets via the `assets` config in wrangler.jsonc.
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/api
          packageManager: pnpm
